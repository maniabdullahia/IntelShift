<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 500 500" width="500" height="500" role="img" aria-label="Animated Comp Intel loader logo">
  <defs>
    <linearGradient id="grad1" gradientUnits="userSpaceOnUse" x1="-23.2071" y1="203.2717" x2="440.7188" y2="211.863">
      <stop offset="0" stop-color="#42A4A2"/>
      <stop offset="0.0186" stop-color="#3E9697"/>
      <stop offset="0.0776" stop-color="#337077"/>
      <stop offset="0.1392" stop-color="#2A515C"/>
      <stop offset="0.203" stop-color="#233948"/>
      <stop offset="0.27" stop-color="#1E2839"/>
      <stop offset="0.3424" stop-color="#1B1D31"/>
