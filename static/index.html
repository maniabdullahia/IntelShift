<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ── Favicons & theme ───────────────────────────────────── -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="color-scheme" content="light" />

  <!-- ── Primary SEO ───────────────────────────────────────── -->
  <title>IntelShift — AI-Powered Competitor Intelligence Platform</title>
  <meta name="description" content="Monitor competitor websites automatically. Track pricing changes, messaging shifts, and feature updates — then get AI-powered recommendations. Built for ecommerce brands and SaaS teams." />
  <meta name="keywords" content="competitor intelligence software, competitor monitoring tool, competitor website tracking, AI competitor analysis, ecommerce competitor monitoring, SaaS competitor tracking, competitor pricing alerts, monitor competitor changes, competitive intelligence platform, competitor change detection" />
  <meta name="author" content="IntelShift" />
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
  <link rel="canonical" href="https://intelshift.ai/" />

  <!-- ── Open Graph ─────────────────────────────────────────── -->
  <meta property="og:type"        content="website" />
  <meta property="og:site_name"   content="IntelShift" />
  <meta property="og:title"       content="IntelShift — AI-Powered Competitor Intelligence Platform" />
  <meta property="og:description" content="Monitor competitor websites automatically. Track pricing changes, messaging shifts, and feature updates — then get AI-powered recommendations for your team." />
  <meta property="og:url"         content="https://intelshift.ai/" />
  <meta property="og:image"       content="https://intelshift.ai/og-image.png" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt"   content="IntelShift — competitor intelligence dashboard" />
  <meta property="og:locale"      content="en_US" />

  <!-- ── Twitter Card ───────────────────────────────────────── -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="IntelShift — AI-Powered Competitor Intelligence Platform" />
  <meta name="twitter:description" content="Monitor competitor websites automatically. Track pricing changes, messaging shifts, and feature updates — then get AI-powered recommendations." />
  <meta name="twitter:image"       content="https://intelshift.ai/og-image.png" />

  <!-- ── Structured data — Organisation + WebSite + SoftwareApp ── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://intelshift.ai/#organization",
        "name": "IntelShift",
        "url": "https://intelshift.ai",
        "logo": {
          "@type": "ImageObject",
          "url": "https://intelshift.ai/favicon.jpg"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "info@intelshift.ai",
          "contactType": "customer support",
          "availableLanguage": "English"
        },
        "description": "AI-powered competitor intelligence platform for ecommerce brands and SaaS companies."
      },
      {
        "@type": "WebSite",
        "@id": "https://intelshift.ai/#website",
        "url": "https://intelshift.ai",
        "name": "IntelShift",
        "description": "Monitor competitor websites, detect meaningful changes, and get AI-powered recommendations.",
        "publisher": { "@id": "https://intelshift.ai/#organization" }
      },
      {
        "@type": "SoftwareApplication",
        "@id": "https://intelshift.ai/#software",
        "name": "IntelShift",
        "url": "https://intelshift.ai",
        "applicationCategory": "BusinessApplication",
        "applicationSubCategory": "Competitor Intelligence",
        "operatingSystem": "Web",
        "description": "Monitor competitor websites automatically. Track pricing changes, messaging shifts, and feature updates — then get AI-powered recommendations for your ecommerce or SaaS team.",
        "offers": {
          "@type": "AggregateOffer",
          "priceCurrency": "USD",
          "lowPrice": "49",
          "highPrice": "149",
          "offerCount": "3",
          "seller": { "@id": "https://intelshift.ai/#organization" }
        },
        "featureList": [
          "Competitor website monitoring",
          "AI-powered change detection",
          "Pricing and positioning alerts",
          "Weekly executive reports",
          "Historical competitor timeline",
          "Noise-resistant change filtering"
        ],
        "publisher": { "@id": "https://intelshift.ai/#organization" }
      }
    ]
  }
  </script>

  <!-- ── DNS prefetch + preconnect ──────────────────────────── -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
  <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- ── Fonts — non-render-blocking ────────────────────────── -->
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,300;1,9..144,400&display=swap"
  />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,300;1,9..144,400&display=swap"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,300;1,9..144,400&display=swap"
    />
  </noscript>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
